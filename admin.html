<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R.S — Administration</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="/">R<span>.S</span></a><a href="/">Site public</a></header><main><section class="hero small"><p>R.S • ESPACE ADMIN</p><h1>Tableau de bord</h1></section><section id="login"><form id="loginForm"><h2>Connexion</h2><label>Mot de passe administrateur<input id="password" type="password" required></label><button class="primary">Se connecter</button><p id="loginMsg"></p></form></section><section id="dash" hidden><div class="bar"><h2>Soumissions</h2><button id="logout">Déconnexion</button></div><div id="items"></div></section></main><script>
const login=document.querySelector("#login"),dash=document.querySelector("#dash"),items=document.querySelector("#items"),msg=document.querySelector("#loginMsg");
async function load(){const r=await fetch("/api/admin/submissions");if(r.status===401){login.hidden=false;dash.hidden=true;return}const a=await r.json();login.hidden=true;dash.hidden=false;items.innerHTML=a.length?a.map(x=>`<article><h3>${esc(x.prenom)} ${esc(x.nom)} <small>${esc(x.id)}</small></h3><p>Âge : ${esc(x.age)} · Téléphone : ${esc(x.telephone)}</p><p>Réseau : ${esc(x.reseau_principal||"—")} · Pseudo : ${esc(x.pseudo||"—")}</p><p>Localisation : ${x.latitude&&x.longitude?esc(x.latitude+", "+x.longitude):"Non fournie"}</p><p>Questionnaire : ${esc(x.temps||"—")} · ${esc(x.motif||"—")} · note ${esc(x.experience||"—")}/5</p><p>${esc(x.amelioration||"")}</p><small>${new Date(x.created_at).toLocaleString("fr-FR")}</small><br><button onclick="del('${encodeURIComponent(x.id)}')">Supprimer</button></article>`).join(""):"<p>Aucune soumission.</p>"}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.querySelector("#loginForm").onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.querySelector("#password").value})});const j=await r.json();if(!r.ok)msg.textContent=j.error;else load()};
document.querySelector("#logout").onclick=async()=>{await fetch("/api/admin/logout",{method:"POST"});load()};
async function del(id){if(confirm("Supprimer cette soumission ?")){await fetch("/api/admin/submissions/"+id,{method:"DELETE"});load()}}
load();
</script></body></html>
